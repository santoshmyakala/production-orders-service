# Satisfies the platform guardrails (see k8s-guardrails-webhook): digest-pinned image from the
# trusted registry, FinOps labels, requests and a memory limit, non-root, no privilege escalation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-orders
  labels: { app.kubernetes.io/name: production-orders }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: production-orders }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: production-orders
        team: production-planning
        cost-center: plant-operations
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: production-orders }
      containers:
        - name: app
          image: production-orders-service # kustomize sets ghcr.io/…@sha256:<digest from the release>
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 8081 }
          env:
            - { name: OIDC_ISSUER_URI, value: "https://login.microsoftonline.com/<tenant-id>/v2.0" }
            - { name: OIDC_AUDIENCE, value: "api://production-orders" }
            - { name: ERP_BASE_URL, value: "http://erp-gateway.erp.svc.cluster.local" }
          envFrom:
            - secretRef: { name: production-orders-db } # DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep: { seconds: 10 } # let endpoints drain before graceful shutdown starts
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: production-orders
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: production-orders }
---
apiVersion: v1
kind: Service
metadata:
  name: production-orders
  labels: { app.kubernetes.io/name: production-orders }
spec:
  selector: { app.kubernetes.io/name: production-orders }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: management, port: 8081, targetPort: management }
