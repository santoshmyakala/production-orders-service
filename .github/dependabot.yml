version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule: { interval: weekly }
    groups:
      spring-boot: { patterns: ["org.springframework.boot*"] }
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
