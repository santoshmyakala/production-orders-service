name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build + test (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (unit + integration tests against PostgreSQL 17 in Docker)
        run: mvn -B -ntp verify
      - name: Test and coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("target/surefire-reports/TEST-*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
          print(f"**Tests:** {t} run, {f} failed, {e} errors, {s} skipped")
          try:
              rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
              m = sum(int(x["LINE_MISSED"]) for x in rows); c = sum(int(x["LINE_COVERED"]) for x in rows)
              print(f"\n**Line coverage (JaCoCo):** {100 * c / (c + m):.1f}%")
          except FileNotFoundError:
              pass
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 14

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          cache: false
      - name: kustomize build + kubeconform (strict, Kubernetes 1.34)
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.0
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          kustomize build deploy | kubeconform -strict -summary -kubernetes-version 1.34.0

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: production-orders-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (image incl. every jar; fail on HIGH/CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: production-orders-service:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (checksum-verified)
        run: |
          v=8.30.1; base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSLO "$base/gitleaks_${v}_linux_x64.tar.gz"; curl -sSLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${v}_checksums.txt"
          tar xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --exit-code 1 .
